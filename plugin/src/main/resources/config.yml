# ============================================================
#  dkBank configuration
#  Text and colors live in messages.yml.
#  Run /bank admin reload after editing (storage and command aliases need a restart).
# ============================================================

command:
  # Extra names for /bank. /dkbank:bank always works, even if another plugin also uses /bank.
  aliases: [dkbank]

# ------------------------------------------------------------
#  How amounts are shown
# ------------------------------------------------------------
currency:
  symbol: "$"
  # before = $100, after = 100$
  symbol-position: before
  # false hides cents everywhere ($1,234 instead of $1,234.56). Balances still keep the cents.
  show-cents: true
  thousands-separator: ","
  decimal-separator: "."
  # Short forms for big numbers (placeholders, the leaderboard, short-from): thousand, million, billion, trillion, quadrillion
  compact-suffixes: [K, M, B, T, Q]
  # Amounts this big or bigger are shown short everywhere ($1.2M instead of $1,234,567.89). 0 = never.
  short-from: 0
  # Decimals in short amounts: 0 = $1M, 1 = $1.2M, 2 = $1.25M
  short-decimals: 1
  # true = show amounts the way your economy plugin does (e.g. EssentialsX's format) instead of the above
  use-economy-format: false

# ------------------------------------------------------------
#  Limits
#  Amounts accept 1000, 1.5k, 2m, 1b, all and half.
# ------------------------------------------------------------
limits:
  # Smallest amount for a deposit, withdrawal or transfer
  min-amount: 1
  # Largest amount per deposit, withdrawal or transfer. 0 = no limit.
  # "all" and "half" are reduced to this instead of failing.
  max-per-transaction: 0
  # The largest bank balance is set per tier in tiers.yml (max-balance).

# ------------------------------------------------------------
#  Fees (percent, e.g. 2.5 = 2.5%). 0 = free.
# ------------------------------------------------------------
fees:
  # Taken from the amount withdrawn: withdrawing 100 at 2% gives 98 to the wallet.
  withdraw-percent: 0
  # Paid by the sender on top of the amount: sending 100 at 2% costs 102.
  transfer-percent: 0

# ------------------------------------------------------------
#  Bank-to-bank transfers (/bank pay)
# ------------------------------------------------------------
transfers:
  enabled: true
  # false = you can only send money to players who are online
  allow-offline-players: true

# ------------------------------------------------------------
#  Interest
#  Times: 30s, 15m, 1h, 7d, 1d 12h.  Rates: percent, e.g. 1 = 1%, 0.25 = 0.25%.
#
#  Interest is paid on the LOWEST balance since the last payout, so money moved in just before a
#  payout doesn't earn anything until the payout after it. Withdrawing lowers what earns right away.
#  Rates, the interest cap and the maximum per payout are set per tier in tiers.yml.
# ------------------------------------------------------------
interest:
  online:
    enabled: true
    # The tier's online-rate is paid for every <period> of play (prorated at logout).
    period: 1h
  offline:
    enabled: true
    # The tier's offline-rate per <period> away, paid at login, compounding: 3 days at 1% per day = 3.03%.
    # Time spent AFK while online also earns this rate instead of the online one.
    period: 1d
    # Time away that counts, at most. Stops accounts of players who quit from growing forever.
    max-time: 7d
  notify:
    # Tell players when they're paid (messages.yml → interest)
    online-payout: true
    offline-payout: true
    # Seconds after joining before the "while you were away" message, so it isn't lost in join spam
    login-delay: 3
    # Sound for a payout. "" = none. Names: https://jd.papermc.io/paper/1.21.4/org/bukkit/Sound.html
    sound: "entity.experience_orb.pickup"

# ------------------------------------------------------------
#  AFK detection (AFK players earn the offline rate instead of the online one)
# ------------------------------------------------------------
afk-detection:
  enabled: true
  # Counted as AFK after this long without moving, looking around, chatting or using commands. 0 = off.
  idle-after: 5m
  # PlaceholderAPI placeholders that say whether a player is AFK, from your AFK plugin.
  # Placeholders that aren't installed are ignored.
  #   EssentialsX: %essentials_afk%  (needs: /papi ecloud download Essentials)
  #   CMI:         %cmi_user_afk%
  #   DirekAntiAFK: %antiafk_afk%
  placeholders:
    - "%essentials_afk%"
    - "%cmi_user_afk%"
    - "%antiafk_afk%"
  # Values that mean "AFK" (not case-sensitive)
  afk-values: ["yes", "true"]

# ------------------------------------------------------------
#  Alt-account limit
#  Only the first <max-accounts> accounts that played from the same internet connection can use the
#  bank. Accounts after that are locked: no deposits, transfers, upgrades or interest. Stops players
#  farming interest (or starting money) on alt accounts.
#  - Staff can allow an account anyway: /bank admin alts <player> allow
#  - dkbank.alts.bypass skips the limit (given to ops by default)
#  - Addresses are stored as salted hashes, never the address itself.
#  - Behind a proxy (Velocity, BungeeCord), IP forwarding must be on; Bedrock players need Floodgate
#    sending their real address. Players on a local address (127.0.0.1, 192.168.x.x) are never locked.
# ------------------------------------------------------------
alt-limit:
  enabled: true
  # Accounts per connection that can use the bank (families and roommates share one, so not too low)
  max-accounts: 3
  # Logins older than this are forgotten (e.g. 30d, 60d). Someone who moved away stops counting.
  remember: 30d
  # true = locked accounts can still withdraw money they already had in the bank
  locked-can-withdraw: true
  # Tell locked players why when they join
  tell-player: true

# ------------------------------------------------------------
#  Menus (layouts, items and sounds are in the menus folder)
# ------------------------------------------------------------
menus:
  # true = /bank, /bank deposit, /bank withdraw, /bank pay, /bank tiers and /bank history (typed without
  # anything after them) open menus. false = they use chat, and /bank menu opens the menu.
  open-from-commands: true
  # Seconds to type an amount or a player name in chat (5-300)
  chat-input-seconds: 30
  # Typing this instead cancels
  cancel-word: "cancel"

# ------------------------------------------------------------
#  Leaderboard (/bank top and the %dkbank_top_...% placeholders)
# ------------------------------------------------------------
leaderboard:
  # Places kept (10-1000)
  size: 100
  # How often it's worked out again (at least 1m). It's never read from the database per view.
  refresh: 5m
  # Accounts never shown (e.g. staff or server accounts)
  hidden: []

# ------------------------------------------------------------
#  /bank history
# ------------------------------------------------------------
history:
  # Lines per page (3-20)
  page-size: 8
  # Java date pattern: https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/time/format/DateTimeFormatter.html
  date-format: "MMM d, HH:mm"
  # e.g. Asia/Manila, Europe/London. Leave empty to use the server's timezone.
  timezone: ""

# ------------------------------------------------------------
#  About dkBank
# ------------------------------------------------------------
# Tell staff (dkbank.admin) when a new dkBank version is out. Checked once at startup.
update-checker: true
# Anonymous usage numbers for the developer on bstats.org (number of servers, versions, storage type).
# No player data. Also turned off for every plugin in plugins/bStats/config.yml.
metrics: true

# ------------------------------------------------------------
#  Storage (changes need a restart)
# ------------------------------------------------------------
storage:
  # sqlite = a file in the plugin folder, nothing to set up (best for one server)
  # mysql / mariadb = a database server (needed if several servers share bank accounts)
  type: sqlite
  # Put in front of every table name, so several plugins or servers can share one database
  table-prefix: "dkbank_"
  sqlite:
    file: "bank.db"
  mysql:
    host: "localhost"
    port: 3306
    database: "dkbank"
    username: "root"
    password: ""
    use-ssl: false
    # Database connections to keep open (2-20)
    pool-size: 6
