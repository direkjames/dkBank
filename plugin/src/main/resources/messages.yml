# ============================================================
#  dkBank messages
#  Format: MiniMessage, https://docs.advntr.dev/minimessage/format.html
#  <prefix> inserts the prefix below. Set any message to "" to turn it off.
#  A list (lines starting with -) is sent as several lines.
# ============================================================

prefix: "<gradient:#F5C542:#D4A017><bold>dkBank</bold></gradient> <dark_gray>»</dark_gray> "

# ------------------------------------------------------------
#  Balance
# ------------------------------------------------------------
# <balance> <wallet> <tier>
balance:
  - "<prefix><gray>Bank balance: <gradient:#F5C542:#D4A017><bold><balance></bold></gradient>"
  - "<prefix><gray>Wallet: <white><wallet></white> <dark_gray>·</dark_gray> Tier: <tier>"
hint: "<prefix><dark_gray>Type <gray>/bank help</gray> for everything you can do."
# <player> <balance>
balance-other: "<prefix><white><player></white><gray>'s bank balance: <gold><balance>"

# ------------------------------------------------------------
#  Deposit and withdraw
# ------------------------------------------------------------
# <amount> <balance>
deposit-success: "<prefix><green>Deposited <white><amount></white>. <gray>Bank balance: <gold><balance>"
# <amount> <received> <fee> <balance>
withdraw-success: "<prefix><green>Withdrew <white><amount></white>. <gray>Bank balance: <gold><balance>"
withdraw-success-fee: "<prefix><green>Withdrew <white><amount></white> <gray>(<white><received></white> after a <white><fee></white> fee). Bank balance: <gold><balance>"

# ------------------------------------------------------------
#  Transfers
# ------------------------------------------------------------
# <amount> <fee> <player> <balance>
pay-sent: "<prefix><green>Sent <white><amount></white> to <white><player></white>'s bank. <gray>Your balance: <gold><balance>"
pay-sent-fee: "<prefix><green>Sent <white><amount></white> to <white><player></white>'s bank <gray>(+<white><fee></white> fee). Your balance: <gold><balance>"
# <amount> <player> <balance>
pay-received: "<prefix><green><white><player></white> sent <white><amount></white> to your bank. <gray>Balance: <gold><balance>"
cannot-pay-self: "<prefix><red>You can't send money to yourself."
transfers-disabled: "<prefix><red>Bank transfers are turned off."
# <player>
target-offline: "<prefix><red><player> must be online to receive money."
receiver-full: "<prefix><red><player>'s bank is full."

# ------------------------------------------------------------
#  Problems
# ------------------------------------------------------------
# <input>
invalid-amount: "<prefix><red>'<input>' isn't a valid amount. <gray>Try 1000, 1.5k, 2m, all or half."
# <min>
amount-too-small: "<prefix><red>The smallest amount is <min>."
# <max>
amount-too-large: "<prefix><red>The largest amount is <max> at a time."
# <wallet>
not-enough-wallet: "<prefix><red>You don't have that much in your wallet. <gray>Wallet: <white><wallet>"
# <balance>
not-enough-bank: "<prefix><red>You don't have that much in the bank. <gray>Balance: <white><balance>"
# <room> <limit>
bank-full: "<prefix><red>Your bank is full. <gray>You can deposit up to <white><room></white> more."
# <player>
unknown-player: "<prefix><red>No bank account found for <player>."
busy: "<prefix><gray>Please wait, your last transaction is still going through."
economy-missing: "<prefix><red>The bank is unavailable: no economy plugin was found."
wallet-error: "<prefix><red>Your wallet couldn't be updated, so nothing was changed."
error: "<prefix><red>Something went wrong and nothing was changed. Please tell a staff member."
player-only: "<prefix><red>Only players can do that."
# <usage>
usage: "<prefix><gray>Use: <white><usage>"

# ------------------------------------------------------------
#  Interest
# ------------------------------------------------------------
interest:
  # <amount> <balance>
  online-payout: "<prefix><green>+<amount></green> <gray>interest. Bank balance: <gold><balance>"
  # <amount> <balance> <time> (how long they were away, e.g. 2d 5h)
  offline-payout:
    - "<prefix><gray>Welcome back! While you were away <dark_gray>(<time>)</dark_gray>, your bank earned <green>+<amount></green>."
    - "<prefix><gray>Bank balance: <gold><balance>"
  # /bank interest. Each line can be turned off with "".
  info:
    # <tier>
    header: "<gradient:#F5C542:#D4A017><bold>dkBank</bold></gradient> <gray>— interest ·</gray> <tier>"
    # <rate> <period>
    online: " <gray>Online: <green><rate>%</green> per <white><period></white> played"
    online-off: " <gray>Online: <dark_gray>none"
    # <rate> <period> <max> (time away that counts, at most)
    offline: " <gray>Offline & AFK: <green><rate>%</green> per <white><period></white> <dark_gray>(counts up to <max> away)"
    offline-off: " <gray>Offline & AFK: <dark_gray>none"
    # <earning> (the part of the balance earning now) <cap>
    earning: " <gray>Earning on: <gold><earning></gold> <dark_gray>(lowest balance since your last payout, up to <cap>)"
    no-cap: "no limit"
    # <time> (until the next online payout) <done> <period>
    next: " <gray>Next payout in <white><time></white> <dark_gray>of play"

# ------------------------------------------------------------
#  Tiers
#  Values for every tier line: <tier> <cost> <max-balance> <cap> <online-rate> <offline-rate>
#  <online-period> <offline-period> <id>
# ------------------------------------------------------------
tiers:
  header: "<gradient:#F5C542:#D4A017><bold>dkBank</bold></gradient> <gray>— bank tiers"
  # Your tier
  current: " <gold>▶</gold> <tier> <gray>· holds <white><max-balance></white> · interest on up to <white><cap></white> · <white><online-rate>%</white>/<white><offline-rate>%</white> <gold>(yours)"
  # Tiers below yours
  below: " <gray>✔ <tier> <gray>· holds <max-balance> · interest on up to <cap> · <online-rate>%/<offline-rate>%"
  # The tier /bank upgrade buys
  next: " <green>▲</green> <tier> <gray>· holds <white><max-balance></white> · interest on up to <white><cap></white> · <white><online-rate>%</white>/<white><offline-rate>%</white> · <green><cost>"
  # Buyable later
  locked: " <gray>○ <tier> <gray>· holds <max-balance> · interest on up to <cap> · <online-rate>%/<offline-rate>% · <cost>"
  # Only through ranks (buyable: false)
  rank-only: " <gray>○ <tier> <gray>· holds <max-balance> · interest on up to <cap> · <online-rate>%/<offline-rate>% · rank perk"
  footer: "<gray>Rates are online/offline. Type <white>/bank upgrade</white> to upgrade."
  footer-max: "<gray>Rates are online/offline. You have the highest tier you can buy."
  no-limit: "no limit"

upgrade:
  # Also: <current> (your tier now) <balance> <seconds>
  info:
    - "<prefix><gray>Upgrade <current> <gray>→</gray> <tier> <gray>for <gold><cost></gold> <gray>(paid from your bank, balance <white><balance></white>)"
    - " <gray>Bank holds up to: <white><max-balance>"
    - " <gray>Interest on up to: <white><cap>"
    - " <gray>Interest: <green><online-rate>%</green> per <online-period> online, <green><offline-rate>%</green> per <offline-period> offline"
  # Clickable: runs /bank upgrade confirm
  confirm-button: " <green><bold>[Click to confirm]</bold></green> <gray>or type <white>/bank upgrade confirm</white> within <seconds>s"
  success: "<prefix><green>Your bank is now <tier><green>! <gray>Paid <white><cost></white>. Balance: <gold><balance>"
  # Sent to everyone else online. "" = off. Also: <player>
  broadcast: ""
  # <cost> <balance>
  not-enough: "<prefix><red>You need <cost> in the bank for <tier><red>. <gray>Balance: <white><balance>"
  max: "<prefix><gray>Your bank is <tier><gray>, the highest tier you can buy."
  expired: "<prefix><gray>That offer ran out. Here it is again:"
  changed: "<prefix><gray>Your tier just changed. Type <white>/bank upgrade</white> to see your next one."

# ------------------------------------------------------------
#  Alt-account limit. <max> is the number of accounts allowed per connection.
# ------------------------------------------------------------
alts:
  locked: "<prefix><red>Your bank is locked: more than <max> accounts play from your connection. <gray>Ask staff if this is a mistake."
  locked-notice: "<prefix><gray>Note: your bank is <red>locked</red> because more than <white><max></white> accounts play from your connection. Ask staff if this is a mistake."

# ------------------------------------------------------------
#  Menus
#  Typing in chat: <cancel> (the cancel word) <seconds> (time allowed)
# ------------------------------------------------------------
menu:
  no-permission: "<prefix><red>You don't have access to that."
  input-deposit: "<prefix><gray>Type how much to <white>deposit</white> in chat (e.g. <white>2500</white>, <white>1.5k</white>, <white>all</white>), or <white><cancel></white>."
  input-withdraw: "<prefix><gray>Type how much to <white>withdraw</white> in chat (e.g. <white>2500</white>, <white>1.5k</white>, <white>all</white>), or <white><cancel></white>."
  input-pay-player: "<prefix><gray>Type the <white>name</white> of the player to send money to, or <white><cancel></white>."
  # <target>
  input-pay-amount: "<prefix><gray>Type how much to send to <white><target></white> (e.g. <white>2500</white>, <white>1.5k</white>), or <white><cancel></white>."
  input-cancelled: "<prefix><gray>Cancelled."
  input-timeout: "<prefix><gray>You didn't type anything in time, so nothing was done."

# ------------------------------------------------------------
#  Leaderboard (/bank top)
# ------------------------------------------------------------
top:
  # <page> <pages> <ago> (since it was worked out) <total> (all banks together)
  header: "<prefix><gray>Richest banks <gray>(page <page>/<pages>, updated <ago> ago)"
  # <rank> <player> <balance> <short>
  entry: " <gold>#<rank></gold> <white><player></white> <gray>· <balance>"
  # <rank>
  you: "<gray>You are <gold>#<rank></gold>."
  # <size>
  you-unranked: "<gray>You aren't in the top <size> yet."
  footer: "<gray>Page <page>/<pages>. <white>/bank top <page></white> for another page."
  empty: "<prefix><gray>Nobody has money in the bank yet."

# ------------------------------------------------------------
#  History
# ------------------------------------------------------------
history:
  # <player> <page> <pages>
  header: "<prefix><gray>Bank history of <white><player></white> <dark_gray>(page <page>/<pages>)"
  empty: "<prefix><gray>No transactions yet."
  # Each line. <line> is the text for that type below. <date> is when it happened.
  entry: " <dark_gray><date></dark_gray> <line>"
  # <amount> <fee> <balance> <player> (the other player) <actor> (the admin)
  types:
    deposit: "<green>+<amount></green> <gray>deposit"
    withdraw: "<red>-<amount></red> <gray>withdrawal"
    transfer-out: "<red>-<amount></red> <gray>to <white><player></white>"
    transfer-in: "<green>+<amount></green> <gray>from <white><player></white>"
    admin-give: "<green>+<amount></green> <gray>added by staff"
    admin-take: "<red>-<amount></red> <gray>removed by staff"
    admin-set: "<yellow>=<amount></yellow> <gray>set by staff"
    refund: "<green>+<amount></green> <gray>refund"
    # <actor> is online or offline
    interest: "<green>+<amount></green> <gray><actor> interest"
    # <tier>
    upgrade: "<red>-<amount></red> <gray>upgraded to <tier>"
    tier-set: "<yellow>Tier</yellow> <gray>set to <tier> <gray>by <actor>"
    # Changes made by other plugins. <actor> is the plugin's source text.
    plugin-give: "<green>+<amount></green> <gray>from <actor>"
    plugin-take: "<red>-<amount></red> <gray>by <actor>"
  # <page> <pages>. Previous and next are clickable.
  footer: "<dark_gray>Page <page>/<pages>"
  previous: "<gold>« Previous"
  next: "<gold>Next »"

# ------------------------------------------------------------
#  Help
# ------------------------------------------------------------
help:
  player:
    - "<gradient:#F5C542:#D4A017><bold>dkBank</bold></gradient> <dark_gray>— your bank account"
    - " <gold>/bank</gold> <gray>your bank (menu)"
    - " <gold>/bank balance</gold> <gray>your balance in chat"
    - " <gold>/bank deposit <amount></gold> <gray>wallet → bank"
    - " <gold>/bank withdraw <amount></gold> <gray>bank → wallet"
    - " <gold>/bank pay <player> <amount></gold> <gray>send to another player's bank"
    - " <gold>/bank history [page]</gold> <gray>your transactions"
    - " <gold>/bank interest</gold> <gray>your interest rates and next payout"
    - " <gold>/bank tiers</gold> <gray>bank tiers"
    - " <gold>/bank top</gold> <gray>the richest banks"
    - " <gold>/bank upgrade</gold> <gray>buy the next tier"
    - " <dark_gray>Amounts: 1000, 1.5k, 2m, all, half"
  admin:
    - "<gradient:#F5C542:#D4A017><bold>dkBank admin</bold></gradient>"
    - " <gold>/bank admin give|take|set <player> <amount>"
    - " <gold>/bank admin balance <player>"
    - " <gold>/bank admin history <player> [page]"
    - " <gold>/bank admin tier <player> <tier|default>"
    - " <gold>/bank admin alts <player> [allow|reset]"
    - " <gold>/bank admin economy [days]"
    - " <gold>/bank admin info</gold> <gray>versions and setup, for support"
    - " <gold>/bank admin reload"

# ------------------------------------------------------------
#  Admin
# ------------------------------------------------------------
admin:
  # <player> <amount> <balance>
  give: "<prefix><green>Added <white><amount></white> to <white><player></white>'s bank. <gray>Balance: <gold><balance>"
  take: "<prefix><green>Removed <white><amount></white> from <white><player></white>'s bank. <gray>Balance: <gold><balance>"
  set: "<prefix><green>Set <white><player></white>'s bank balance to <gold><balance>"
  # <player> <balance>
  take-insufficient: "<prefix><red><player> only has <balance> in the bank."
  # <player>
  limit: "<prefix><red>That would put <player>'s bank over the maximum."
  # /bank admin economy [days]. <days> <total> <accounts> <interest-day> (last 24 hours) <interest-period>
  # <interest-average> (per day) <interest-share> (interest in the period as % of all bank money)
  # <deposits> <withdrawals> <transfers> <upgrades> <upgrade-count> <fees>
  economy:
    - "<prefix><gold><bold>Economy report</bold></gold> <gray>(last <days> days)"
    - " <gray>In banks: <gold><total></gold> <gray>across <white><accounts></white> accounts"
    - " <gray>Interest created: <green>+<interest-day></green> in 24h, <green>+<interest-period></green> in <days> days"
    - " <gray>  about <white><interest-average></white> a day, <white><interest-share>%</white> of all bank money"
    - " <gray>Deposits: <white><deposits></white> · Withdrawals: <white><withdrawals></white>"
    - " <gray>Sent between players: <white><transfers>"
    - " <gray>Spent on upgrades: <white><upgrades></white> (<upgrade-count>) · Fees: <white><fees>"
  economy-earners: " <gray>Top interest earners:"
  # <rank> <player> <amount>
  economy-earner: "   <gray><rank>.</gray> <white><player></white> <green>+<amount>"
  # /bank admin alts. <player> <count> <max> <window>
  alts-header: "<prefix><gray>Accounts on <white><player></white>'s latest connection (last <window>, limit <max>):"
  # <name> <status> <date> (first seen there)
  alts-entry: " <white><name></white> <gray>·</gray> <status> <gray>· first seen <date>"
  alts-status-allowed: "<green>can use the bank"
  alts-status-locked: "<red>locked"
  alts-status-exempt: "<aqua>allowed by staff"
  alts-none: "<prefix><gray>No logins recorded for <white><player></white> (or the alt limit is off)."
  alts-allowed: "<prefix><green><player> can use the bank whatever the alt limit."
  alts-reset: "<prefix><green><player> follows the alt limit again."
  # <player> <tier>
  tier-set: "<prefix><green>Set <white><player></white>'s bought tier to <tier><green>."
  # Their permission gives a higher tier than the one just set. <player> <tier>
  tier-permission: "<prefix><gray>Note: <white><player></white> has <tier> <gray>through a permission, which is higher."
  # <input> <tiers>
  unknown-tier: "<prefix><red>No tier called '<input>'. <gray>Tiers: <white><tiers>"
  no-shares: "<prefix><red>Use an exact amount for admin commands, not all or half."
  reloaded: "<prefix><green>config.yml, messages.yml, tiers.yml and the menus reloaded. <gray>(Storage and command aliases need a restart.)"
  # <version> (the new one) <current>
  update-available: "<prefix><gray>dkBank <white><version></white> is out (you have <current>). Download it where you bought dkBank."
  # /bank admin info, for support requests
  info:
    - "<prefix><gold><bold>dkBank <version></bold></gold> <gray>on <white><server></white> (Java <java>)"
    - " <gray>Storage: <white><storage></white> · Economy: <white><economy></white> · PlaceholderAPI: <white><papi>"
    - " <gray>Accounts: <white><accounts></white> · In banks: <white><total></white> · Loaded now: <white><loaded>"
    - " <gray>Tiers: <white><tiers></white> · Alt limit: <white><alts></white> · Menus from commands: <white><menus>"
    - " <gray>Newest version: <white><latest>"
  # <file>
  reload-failed: "<prefix><red><file> has a mistake, so nothing was reloaded. <gray>The console says where."
